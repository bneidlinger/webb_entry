[project]
name = "webbwatch-api"
version = "0.1.0"
description = "WebbWatch AI — FastAPI service for JWST data discovery and analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "redis>=5.1",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "structlog>=24.4",
  # CLI (python -m app ingest mast ...)
  "typer>=0.13",
  # Azure SDKs (Blob signed-URL generation, managed identity)
  "azure-storage-blob>=12.23",
  "azure-identity>=1.19",
  # Cloud AI provider (works for both OpenAI and Azure OpenAI)
  "openai>=1.54",
  # MAST + astronomy (also used by worker; lives here too so the CLI/API can ingest directly)
  "astropy>=6.1",
  "astroquery>=0.4.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() in default args is idiomatic; tests prefer readable wide rows.
"app/routes/*.py" = ["B008"]
"tests/*.py" = ["E501"]
# Alembic auto-generates migrations; don't fight them over line length / import order.
"alembic/versions/*.py" = ["E501", "I001"]
"alembic/env.py" = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
